[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pamachain"
version = "0.1.0"
description = "Educational append-only password manager with an authenticated local ledger"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Matin Odoom" }]
dependencies = [
    "argon2-cffi>=23.1",
    "customtkinter>=5.2",
    "ecdsa>=0.18",
    "pycryptodome>=3.19",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "flake8>=7",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-xvfb>=2.0",
]

[project.scripts]
pamachain = "pamachain.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pamachain*"]
